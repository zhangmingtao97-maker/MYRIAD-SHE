name: ${COMPOSE_PROJECT_NAME}

services:
  gateway:
    image: nginx:alpine
    container_name: ${GATEWAY_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/myriadshe.conf:/etc/nginx/conf.d/default.conf:ro
      - /data/hszf/hszfckga.com_bundle.crt:/etc/nginx/certs/hszfckga.com_bundle.crt:ro
      - /data/hszf/hszfckga.com.key:/etc/nginx/certs/hszfckga.com.key:ro
    depends_on:
      api: { condition: service_healthy }
      admin: { condition: service_started }
      minio: { condition: service_started }
    networks: [myriad_she_prod_net]

  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: ${POSTGRES_CONTAINER_NAME}
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${POSTGRES_VOLUME}:/var/lib/postgresql/data
    networks: [myriad_she_prod_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE}
    container_name: ${REDIS_CONTAINER_NAME}
    restart: unless-stopped
    volumes:
      - ${REDIS_VOLUME}:/data
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    networks: [myriad_she_prod_net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: ${MINIO_IMAGE}
    container_name: ${MINIO_CONTAINER_NAME}
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ORIGIN}
    volumes:
      - ${MINIO_VOLUME}:/data
    command: ["server", "/data", "--console-address", ":9001"]
    ports: ["127.0.0.1:${MINIO_HOST_PORT}:9000"]
    expose: ["${MINIO_CONTAINER_PORT}"]
    networks: [myriad_she_prod_net]

  api:
    image: myriad-she-api:production
    build:
      context: ./backend
      target: production
    container_name: ${API_CONTAINER_NAME}
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
    expose: ["${PORT}"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [myriad_she_prod_net]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:${PORT}/${API_PREFIX}/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  admin:
    image: myriad-she-admin:production
    build:
      context: .
      dockerfile: management/Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_API_REQUEST_TIMEOUT_MS: ${VITE_API_REQUEST_TIMEOUT_MS}
        VITE_MEDIA_UPLOAD_TIMEOUT_MS: ${VITE_MEDIA_UPLOAD_TIMEOUT_MS}
    container_name: ${ADMIN_CONTAINER_NAME}
    restart: unless-stopped
    expose: ["80"]
    depends_on:
      api: { condition: service_healthy }
    networks: [myriad_she_prod_net]

networks:
  myriad_she_prod_net:
    name: ${DOCKER_NETWORK}

volumes:
  myriad_she_prod_postgres_data:
    name: ${POSTGRES_VOLUME}
  myriad_she_prod_redis_data:
    name: ${REDIS_VOLUME}
  myriad_she_prod_minio_data:
    name: ${MINIO_VOLUME}
