map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name hszfckga.com www.hszfckga.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name hszfckga.com www.hszfckga.com;

  ssl_certificate /etc/nginx/certs/hszfckga.com_bundle.crt;
  ssl_certificate_key /etc/nginx/certs/hszfckga.com.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 12m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  proxy_connect_timeout 10s;
  proxy_send_timeout 90s;
  proxy_read_timeout 90s;

  add_header Strict-Transport-Security "max-age=15552000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  location /api/ {
    set $api_upstream api:62021;
    proxy_pass http://$api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /api {
    return 308 /api/;
  }

  location ^~ /myriad-she/ {
    set $minio_upstream minio:9000;
    proxy_pass http://$minio_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_request_buffering off;
    proxy_buffering off;
  }

  location / {
    set $admin_upstream admin:80;
    proxy_pass http://$admin_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
